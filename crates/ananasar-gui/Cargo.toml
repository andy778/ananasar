[package]
name = "ananasar-gui"
version.workspace = true
edition.workspace = true
# egui/eframe 0.36 require Rust 1.95, higher than the workspace default (1.92).
rust-version = "1.95"
license.workspace = true

[[bin]]
name = "ananasar-gui"
path = "src/main.rs"

[dependencies]
ananasar-core = { path = "../ananasar-core" }
ananasar-net = { path = "../ananasar-net" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
eframe = "0.36"
egui_extras = "0.36"
rfd = "0.17.2"

[lints]
workspace = true
