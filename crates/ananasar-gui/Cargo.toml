[package]
name = "ananasar-gui"
version.workspace = true
edition.workspace = true
description = "The Ananasar GUI (egui); run it with `ananasar gui`."
# egui/eframe 0.36 require Rust 1.95, higher than the workspace default (1.92).
rust-version = "1.95"
license.workspace = true

[dependencies]
ananasar-core = { path = "../ananasar-core" }
ananasar-net = { path = "../ananasar-net" }
ananasar-storm = { path = "../ananasar-storm" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
eframe = "0.37"
egui_extras = "0.37"
rfd = "0.17.2"

[target.'cfg(windows)'.dependencies]
ananasar-dde = { path = "../ananasar-dde" }

[dev-dependencies]
# Headless rendering of the README screenshot (docs/screenshots.md). The
# wgpu renderer prefers a software adapter, so it needs no GPU.
egui_kittest = { version = "0.37", features = ["eframe", "wgpu"] }

[lints]
workspace = true
