[package]
name = "ananasar-gui"
version.workspace = true
edition.workspace = true
# egui/eframe 0.36 require Rust 1.95, higher than the workspace default (1.92).
rust-version = "1.95"
license.workspace = true

[[bin]]
name = "ananasar-gui"
path = "src/main.rs"

[dependencies]
ananasar-core = { path = "../ananasar-core" }
eframe = "0.36"
egui_extras = "0.36"
