[package]
name = "ananasar-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "ananasar"
path = "src/main.rs"

[features]
# `cargo build --no-default-features` gives the small headless CLI (no egui,
# nothing to link on a server). The default build is the whole program.
default = ["gui", "mcp"]
# `ananasar gui`. egui/eframe need Rust 1.95; without this feature the CLI
# builds on the workspace's 1.92.
gui = ["dep:ananasar-gui"]
# `ananasar mcp`, the MCP server on stdio.
mcp = ["dep:ananasar-mcp"]

[dependencies]
ananasar-core = { path = "../ananasar-core" }
ananasar-net = { path = "../ananasar-net" }
ananasar-storm = { path = "../ananasar-storm" }
ananasar-gui = { path = "../ananasar-gui", optional = true }
ananasar-mcp = { path = "../ananasar-mcp", optional = true }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4"

[dev-dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

# Same lints as the workspace, except `unsafe_code`: it is denied everywhere
# and allowed in exactly one module, `console` (Windows console detach).
[lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
uninlined_format_args = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
explicit_iter_loop = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
