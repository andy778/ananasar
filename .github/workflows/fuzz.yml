name: fuzz

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz parsers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # pinned
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-fuzz
      - name: Smoke-fuzz the untrusted parsers
        # Pin the fuzz target to gnu: the prebuilt cargo-fuzz is musl-static and
        # would otherwise default to a musl target, which the sanitizer rejects.
        run: |
          cargo +nightly fuzz run frame --target x86_64-unknown-linux-gnu -- -max_total_time=60 -rss_limit_mb=4096
          cargo +nightly fuzz run server_process --target x86_64-unknown-linux-gnu -- -max_total_time=60 -rss_limit_mb=4096
