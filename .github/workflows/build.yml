name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace -- -D warnings
      # The tag build stamps the version with this script and then builds with
      # --locked, so check in a throwaway copy that the two still agree.
      - name: Check version stamping keeps Cargo.lock in sync
        run: |
          tmp="$(mktemp -d)"
          git ls-files -z | xargs -0 cp --parents -t "$tmp"
          cd "$tmp"
          GITHUB_REF=refs/tags/v9.9.9 GITHUB_REF_NAME=v9.9.9 ./scripts/stamp-version.sh
          cargo metadata --locked --format-version 1 > /dev/null

  msrv:
    name: msrv (rust 1.92)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # pinned
        with:
          toolchain: "1.92"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The GUI needs a newer Rust (egui 0.36), so only the other crates are checked.
      - run: cargo test --locked -p ananasar-core -p ananasar-net -p ananasar-cli -p ananasar-mcp -p ananasar-storm

  deny:
    name: cargo-deny (supply chain)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans sources licenses

  notices:
    name: third-party notices and sbom
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-about,cargo-audit,cargo-cyclonedx
      - name: Stamp version from tag
        run: ./scripts/stamp-version.sh
      - name: Collect licence texts, advisories and the SBOM
        run: ./scripts/make-notices.sh notices
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notices
          path: notices/*
          if-no-files-found: error

  windows:
    name: build windows x64 exes
    needs: notices
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-auditable
      - name: Stamp version from tag
        shell: bash
        run: ./scripts/stamp-version.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices
          path: notices
      - name: Build release
        env:
          ANANASAR_NOTICES: ${{ github.workspace }}/notices
        run: cargo auditable build --release --workspace --locked
      - name: Collect binaries
        shell: bash
        run: |
          mkdir dist
          cp target/release/ananasar.exe dist/
          cp target/release/ananasar-mcp.exe dist/
          cp target/release/ananasar-gui.exe dist/
          ls -la dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ananasar-windows-x64
          path: dist/*.exe
          if-no-files-found: error

  macos:
    name: build macos universal
    needs: notices
    # Release-only: not a required check, and macOS minutes are expensive.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-auditable
      - name: Stamp version from tag
        shell: bash
        run: ./scripts/stamp-version.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices
          path: notices
      - name: Build release (both arches)
        env:
          ANANASAR_NOTICES: ${{ github.workspace }}/notices
        run: |
          cargo auditable build --release --workspace --locked --target aarch64-apple-darwin
          cargo auditable build --release --workspace --locked --target x86_64-apple-darwin
      - name: Make universal binaries
        run: |
          mkdir -p dist
          for bin in ananasar ananasar-mcp ananasar-gui; do
            lipo -create -output "dist/$bin" \
              "target/aarch64-apple-darwin/release/$bin" \
              "target/x86_64-apple-darwin/release/$bin"
            chmod +x "dist/$bin"
            lipo -info "dist/$bin"
          done
          tar -C dist -czf ananasar-macos-universal.tar.gz ananasar ananasar-mcp ananasar-gui
          ls -la dist ananasar-macos-universal.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ananasar-macos-universal
          path: ananasar-macos-universal.tar.gz
          if-no-files-found: error

  linux:
    name: build linux x64
    needs: notices
    # Release-only: `test (linux)` already covers Linux on PRs.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-auditable
      - name: Stamp version from tag
        shell: bash
        run: ./scripts/stamp-version.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices
          path: notices
      - name: Build release
        env:
          ANANASAR_NOTICES: ${{ github.workspace }}/notices
        run: cargo auditable build --release --workspace --locked
      - name: Collect binaries
        run: |
          mkdir -p dist
          cp target/release/ananasar dist/
          cp target/release/ananasar-mcp dist/
          cp target/release/ananasar-gui dist/
          chmod +x dist/*
          tar -C dist -czf ananasar-linux-x86_64.tar.gz ananasar ananasar-mcp ananasar-gui
          ls -la dist ananasar-linux-x86_64.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ananasar-linux-x86_64
          path: ananasar-linux-x86_64.tar.gz
          if-no-files-found: error

  source:
    name: source archives
    # Release-only: the archives are attached to the release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Archive the tagged commit
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir source
          git archive --format=tar.gz --prefix="ananasar-${version}/"             -o "source/ananasar-${version}-source.tar.gz" HEAD
          git archive --format=zip --prefix="ananasar-${version}/"             -o "source/ananasar-${version}-source.zip" HEAD
          ls -la source
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source
          path: source/*
          if-no-files-found: error

  release:
    name: release
    needs: [notices, windows, macos, linux, source]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write # keyless cosign signing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Check that every expected asset was built
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          missing=0
          for f in             artifacts/ananasar-windows-x64/ananasar.exe             artifacts/ananasar-windows-x64/ananasar-mcp.exe             artifacts/ananasar-windows-x64/ananasar-gui.exe             artifacts/ananasar-macos-universal/ananasar-macos-universal.tar.gz             artifacts/ananasar-linux-x86_64/ananasar-linux-x86_64.tar.gz             artifacts/notices/licenses.txt             artifacts/notices/dependencies.txt             artifacts/notices/advisories.txt             artifacts/notices/ananasar-cli.cdx.json             artifacts/notices/ananasar-mcp.cdx.json             artifacts/notices/ananasar-gui.cdx.json             "artifacts/source/ananasar-${version}-source.tar.gz"             "artifacts/source/ananasar-${version}-source.zip"; do
            if [ ! -f "$f" ]; then echo "::error::missing release asset: $f"; missing=1; fi
          done
          exit "$missing"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign release files (keyless)
        run: |
          for f in artifacts/**/*.exe artifacts/**/*.tar.gz artifacts/**/*.zip artifacts/notices/*; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
        shell: bash
      - name: Attach binaries to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/notices/*.txt
            artifacts/notices/*.cdx.json
            artifacts/**/*.sigstore.json
          # semantic-release writes the release notes; this job only attaches files.
          generate_release_notes: false
          fail_on_unmatched_files: true
