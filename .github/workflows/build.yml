name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace -- -D warnings

  deny:
    name: cargo-deny (supply chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans sources

  windows:
    name: build windows x64 exes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-auditable
      - name: Build release
        run: cargo auditable build --release --workspace --locked
      - name: Collect binaries
        shell: bash
        run: |
          mkdir dist
          cp target/release/ananasar.exe dist/
          cp target/release/ananasar-gui.exe dist/
          ls -la dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ananasar-windows-x64
          path: dist/*.exe
          if-no-files-found: error

  macos:
    name: build macos universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-auditable
      - name: Build release (both arches)
        run: |
          cargo auditable build --release --workspace --locked --target aarch64-apple-darwin
          cargo auditable build --release --workspace --locked --target x86_64-apple-darwin
      - name: Make universal binaries
        run: |
          mkdir -p dist
          for bin in ananasar ananasar-gui; do
            lipo -create -output "dist/$bin" \
              "target/aarch64-apple-darwin/release/$bin" \
              "target/x86_64-apple-darwin/release/$bin"
            chmod +x "dist/$bin"
            lipo -info "dist/$bin"
          done
          tar -C dist -czf ananasar-macos-universal.tar.gz ananasar ananasar-gui
          ls -la dist ananasar-macos-universal.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ananasar-macos-universal
          path: ananasar-macos-universal.tar.gz
          if-no-files-found: error

  linux:
    name: build linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-auditable
      - name: Build release
        run: cargo auditable build --release --workspace --locked
      - name: Collect binaries
        run: |
          mkdir -p dist
          cp target/release/ananasar dist/
          cp target/release/ananasar-gui dist/
          chmod +x dist/*
          tar -C dist -czf ananasar-linux-x86_64.tar.gz ananasar ananasar-gui
          ls -la dist ananasar-linux-x86_64.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ananasar-linux-x86_64
          path: ananasar-linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    name: release
    needs: [windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # keyless cosign signing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign release files (keyless)
        run: |
          for f in artifacts/**/*.exe artifacts/**/*.tar.gz; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
        shell: bash
      - name: Attach binaries to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.tar.gz
            artifacts/**/*.sigstore.json
          generate_release_notes: true
          fail_on_unmatched_files: true
