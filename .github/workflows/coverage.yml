name: coverage

# Line coverage, reported and not enforced: no threshold, and not a required
# check. Pull requests get a per-crate table in the job summary; pushes to main
# also update the README badge on the `badges` branch. No third-party service.
on:
  push:
    branches: [main]
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: coverage (linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: cargo-llvm-cov
      # The GUI and the Windows-only DDE crate are left out. The CLI is built
      # without its `gui` feature (as in the msrv job) so egui is not pulled in,
      # but with `mcp`, so `ananasar mcp` is covered too.
      - name: Run the tests with coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report --locked -p ananasar-core -p ananasar-net -p ananasar-storm -p ananasar-mcp
          cargo llvm-cov --no-report --locked -p ananasar-cli --no-default-features --features mcp
      - name: Write the reports
        run: |
          mkdir coverage
          cargo llvm-cov report --lcov --output-path coverage/lcov.info
          cargo llvm-cov report --json --summary-only --output-path coverage/summary.json
          {
            echo '## Line coverage'
            echo
            python3 scripts/coverage-summary.py coverage/summary.json --badge coverage/coverage.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov
          path: coverage/lcov.info
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-badge
          path: coverage/coverage.json
          if-no-files-found: error

  # The one CI job that writes (AGENTS.md): it commits coverage.json to the
  # orphan `badges` branch, which holds nothing else and is not covered by the
  # protect-main ruleset. Pull requests never get here.
  badge:
    name: update coverage badge
    needs: coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # Two quick pushes to main must not race each other's badge commit.
    concurrency:
      group: coverage-badge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-badge
          path: ${{ runner.temp }}/badge
      - name: Commit coverage.json to the badges branch
        env:
          BADGE: ${{ runner.temp }}/badge/coverage.json
        run: |
          if git ls-remote --exit-code --heads origin badges > /dev/null; then
            git fetch --depth 1 origin badges
            git switch -c badges FETCH_HEAD
          else
            # First run: an orphan branch with no history and no other files.
            git switch --orphan badges
          fi
          cp "$BADGE" coverage.json
          git add coverage.json
          if git diff --cached --quiet; then
            echo "coverage.json is unchanged"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "chore: coverage $(python3 -c 'import json,sys; print(json.load(sys.stdin)["message"])' < coverage.json)"
          git push origin badges
