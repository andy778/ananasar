name: audit

# RustSec advisories as GitHub code scanning alerts (Security tab), not as a
# release file. Runs on main and daily, because new advisories appear without
# any commit. Findings accepted in deny.toml are left out.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sarif:
    name: cargo-audit to code scanning
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2
        with:
          tool: cargo-audit
      - name: Run cargo-audit and convert to SARIF
        run: |
          # A finding makes cargo-audit exit non-zero; the SARIF carries it.
          cargo audit --json --color never > audit.json || true
          python3 scripts/audit-sarif.py deny.toml < audit.json > audit.sarif
      - uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: audit.sarif
          category: cargo-audit
