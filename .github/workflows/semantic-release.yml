name: release

# Runs scripts/next-release.py, which computes the next version from the
# Conventional Commits on main, then creates the v* tag and the GitHub Release. The tag push triggers build.yml, which
# builds, signs and attaches the binaries. The tag must be pushed with a GitHub
# App token: a push made with the default GITHUB_TOKEN does not start workflows.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only print the next version and release notes
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: semantic-release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MODE: ${{ inputs.dry_run && '--dry-run' || '--create' }}
        run: python3 scripts/next-release.py "$MODE"
