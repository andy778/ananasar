# Feature parity table: which behaviours of the original Ananas are in Ananasar.
#
# Every entry is a [[feature]] with:
#   id      unique short name
#   area    server | client | gui | files
#   feature one line, behavioural wording
#   status  shipped | partial | missing
#   tests   "path::test_fn" entries (single-line array); required for shipped
#   issue   GitHub issue number, required for partial and missing
#   note    optional, what is not covered
#
# `cargo test -p ananasar-core --test parity_table` fails when a shipped entry
# has no tests, or a named test does not exist as a #[test] fn in that file.
# GUI behaviour with no automated test is "partial" and says so in the note.
# Wording stays behavioural: see CLAUDE.md for what must not be used.

[[feature]]
id = "server-fc-3-4-6-16-22-23"
area = "server"
feature = "Server answers function codes 3, 4, 6, 16, 22 and 23 with the specified replies"
status = "shipped"
tests = ["crates/ananasar-core/tests/golden.rs::golden_recordings_replay", "crates/ananasar-core/src/lib.rs::read_holding_returns_values", "crates/ananasar-core/src/lib.rs::write_single_then_read_back"]

[[feature]]
id = "server-exceptions"
area = "server"
feature = "Unsupported function codes and out-of-range quantities give exception replies"
status = "shipped"
tests = ["crates/ananasar-core/src/lib.rs::unsupported_function_yields_exception", "crates/ananasar-core/src/lib.rs::over_limit_quantity_is_rejected_not_overflowed"]

[[feature]]
id = "server-unit-filter"
area = "server"
feature = "Requests for a non-matching unit id are dropped silently"
status = "shipped"
tests = ["crates/ananasar-core/src/lib.rs::uid_mismatch_is_dropped"]

