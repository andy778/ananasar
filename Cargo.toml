[workspace]
resolver = "3"
members = ["crates/ananasar-core", "crates/ananasar-net", "crates/ananasar-cli", "crates/ananasar-gui", "crates/ananasar-parity", "crates/ananasar-dde"]
# The fuzz crate needs a nightly toolchain + libFuzzer, so it is not part of the
# normal workspace build.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[profile.release]
lto = true
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
uninlined_format_args = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
explicit_iter_loop = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
