[package]
name = "xtask"
# Not the workspace version: `scripts/stamp-version.sh` only stamps the
# `ananasar-*` packages, so a workspace version here would leave Cargo.lock out
# of date on tag builds.
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Repository tasks: `cargo xtask ci` runs the checks CI runs."

[lints]
workspace = true
